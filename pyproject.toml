[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-predictor"
version = "0.1.0"
dependencies = [
    "mypy",
    "pandas",
    "pandas-stubs",
    "python-dotenv",
    "seaborn",
    "types-seaborn",
    "scikit-learn",
    "streamlit",
    "matplotlib",
    "types-matplotlib",
    "gdown"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
